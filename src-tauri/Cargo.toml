[package]
name = "pro"
version = "0.1.0"
description = "Cloud-backed daily planning and focus"
authors = ["PRO contributors"]
edition = "2021"

[lib]
name = "pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pro"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:rfd", "dep:open"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
url = "2"
base64 = "0.22"
keyring = { version = "3.6", features = ["windows-native"] }
rfd = { version = "0.15", optional = true }
open = { version = "5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
